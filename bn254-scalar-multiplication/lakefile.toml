name = "bn254-scalar-multiplication"
version = "0.1.0"
defaultTargets = ["Kriterion", "Tests"]

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "bda0be2da973b1304e016589bb794b22ca299f45"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.1"

[[lean_lib]]
name = "Kriterion"
srcDir = "formal"
roots = ["BN254", "Benchmark", "Cryptography.Assumptions", "Cryptography.Primitives", "Cryptography.Probability", "Cryptography.RandomOracle", "Cryptography.Permutation", "Encoding", "GarbledCircuit", "RandomizedEncoding", "ScalarMultiplication", "Security.AdaptivePrivacy", "Security.Correctness", "Solution"]

[[lean_lib]]
name = "Tests"
srcDir = "tests"
roots = ["TestSolution"]
