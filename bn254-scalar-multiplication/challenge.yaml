id: scalar-multiplication
title: Smallest BN254 scalar multiplication garbled circuit
submissions_open_at: "2026-09-17T03:00:00Z"
submission_access: permissionless
statement: |
  Authors must build a computable garbled circuit for fixed-scalar multiplication on BN254.
  The garbler holds a nonzero scalar. The evaluator supplies affine coordinates.
  The circuit must reject inputs outside `y² = x³ + 3`. It must return the scalar multiple for valid inputs.
  Authors must prove correctness in Lean for every field-element input and random tape.
  The public byte layout must remain constant for every scalar and random tape.
  The evaluator receives its input separately from exactly 508 selected 128-bit Lamport labels.
  Each coordinate uses 254 little-endian bits. The labels must satisfy the matching Bitcoin HASH160 locks.
  The adversary selects its input after it sees the public circuit. It can query all public oracles.
  The first simulator stage receives only the public parameter and fixed byte count. The second stage receives the input and output.
  The simulator uses private coins. Its oracle handler must preserve every prior query answer.
  Authors must provide one finite probabilistic arithmetic machine for the complete simulator.
  The machine uses sixteen 256-bit registers, RAM with 256-bit addresses, and four binary stacks.
  Its fixed instructions support word arithmetic, bit operations, comparison, and BN254 field arithmetic.
  Its group instruction adds two BN254 points and rejects invalid point encodings.
  Its other instructions load or store one word, write a constant, branch, push or pop one bit, draw one fair bit, or halt.
  Each instruction has a fixed number of bounded operands. The program counter has at most 256 bits.
  The instruction set accepts no Lean callbacks or arbitrary probability distributions.
  The machine pays one unit per instruction and one unit per control-table entry.
  The total budget after q adversary oracle queries is B(q) = 64*q^2 + 134217728*q + 70368744177664 units.
  One counter covers setup, both simulator stages, private coins, and all oracle responses.
  The machine starts with zero registers, zero RAM, and empty binary stacks. It has no external function calls or free advice tables.
  The fixed protocol supplies public inputs as bits. The machine produces the complete canonical public bytes.
  The decoder supplies only the adversary's public view. The machine never receives the decoded value.
  The interpreter aborts when the machine exceeds its budget or returns a reply with the wrong length.
  Authors must prove that the real-to-ideal advantage plus the ideal-to-machine advantage is at most (Q + 1) / 2^100.
  Here Q is the sum of the adversary's two declared oracle-query budgets. The adversary's local computation remains unrestricted.
  This bound includes sampling approximation and abort error. One machine must work for every scalar and adversary.
  The numerical budget covers the local ArgoMAC baseline's complete arithmetic phase sum.
  Lean checks that cost bound and the complete machine-to-ideal simulation proof.
  The local ArgoMAC baseline proves the revised obligation.
  The proof uses the pinned VCV-io probability library and independent uniform permutation families. The simulator may program fresh pairs.
  The curve certificate premises remain explicit. The shared library proves scalar-field primality.
  The objective minimizes ciphertext bytes. The encoding must preserve every construction-dependent public field that evaluation needs.
  The byte count excludes secret encoding keys, selected input labels, and fixed challenge data.
  The local Lean obligation and the published library pin enforce this budget.
