id: scalar-multiplication
title: Smallest BN254 scalar multiplication garbled circuit
submissions_open_at: "2026-09-17T03:00:00Z"
submission_access: permissionless
statement: |
  Build a computable garbled circuit for fixed-scalar multiplication on BN254.
  The garbler holds a nonzero scalar. The evaluator supplies affine coordinates.
  Reject inputs outside `y² = x³ + 3`. Return the scalar multiple for valid inputs.

  Prove these properties in Lean:

  - correct evaluation for every field-element input and random tape, including off-curve rejection;
  - a constant flat public byte layout that does not reveal the scalar;
  - 100-bit adaptive privacy in the two-stage game, with work equal to public queries plus one decision step;
  - one 128-bit Lamport label pair for each bit of `x || y`, with 254 little-endian bits per coordinate; and
  - encoded labels that satisfy the matching Bitcoin HASH160 locks.

  The adversary selects its input after it sees the public circuit. It can query all public oracles.
  The simulator receives only the topology, selected input, and output. It uses private coins in each stage.
  The proof uses the pinned VCV-io random-oracle model and independent uniform permutation families.
  The curve certificate premises remain explicit. The shared library proves scalar-field primality.
  The evaluator receives its input separately from exactly 508 labels. The work count excludes local computation.
  The simulator can program fresh permutation pairs. It must preserve every prior query answer.
  Authors may use VCV-io primitives, intermediate games, and reductions to prove the fixed obligation.
  Authors must not change the final security game, public oracle access, or work count.

  Minimize ciphertext size in bytes. Count every construction-dependent public field that evaluation needs.
  The encoding must preserve the complete public circuit. The byte count must be constant for all scalars and random tapes.
  The count excludes secret encoding keys, selected input labels, and fixed challenge data.
